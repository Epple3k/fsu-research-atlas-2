name: Deploy Pages

# Publishes just the web/ folder as the site root, so the live URL is
# https://<user>.github.io/<repo>/ instead of .../<repo>/web/index.html.
# One-time manual step this can't do for you: in the repo's Settings > Pages,
# set "Build and deployment > Source" to "GitHub Actions" (not "Deploy from a
# branch") — after that, every push to main redeploys automatically.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
